<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria de Fontaine • Guias e Builds</title>
    
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #170f0a;
            --bg-card: #281911;
            --paper-bg: #f6eedd;
            --paper-border: #d2c0a3;
            --paper-sub: #ede0c7;
            --gold-accent: #c59b4c;
            --gold-light: #e6c581;
            --gold-border: #8b6833;
            --text-dark: #2a190f;
            --text-light: #f5ebe1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(197, 155, 76, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(50, 30, 20, 0.4) 0%, transparent 50%);
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* HEADER */
        .site-header {
            background: linear-gradient(180deg, #1f140e 0%, rgba(23, 15, 10, 0.95) 100%);
            border-bottom: 2px solid var(--gold-border);
            padding: 24px 20px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #bfa593;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .main-container { max-width: 1050px; margin: 24px auto 0; padding: 0 16px; }

        /* FILTROS */
        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .search-box { position: relative; width: 100%; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold-accent); }
        .search-input {
            width: 100%; background: #1c1109; border: 1px solid #4a3223;
            border-radius: 30px; padding: 10px 16px 10px 42px; color: var(--text-light);
            font-family: inherit; font-size: 0.95rem; outline: none;
        }
        .search-input:focus { border-color: var(--gold-accent); }

        .filter-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .filter-label { font-size: 0.8rem; font-weight: 600; color: var(--gold-light); text-transform: uppercase; letter-spacing: 1px; min-width: 80px; }
        .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .filter-btn {
            background: #20130b; border: 1px solid #4a3223; color: #d8c2b2;
            padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active { border-color: var(--gold-accent); color: #fff; }
        .filter-btn.active { background: var(--gold-accent); color: #1a0f08; font-weight: 700; }

        /* NOVO CARTÃO RETANGULAR QUADRICULADO */
        .build-card-rect {
            display: grid;
            grid-template-columns: 210px 190px 1fr 180px;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            align-items: stretch;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .build-card-rect:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-color: var(--gold-light); }

        /* Divisórias do Grid */
        .bc-section {
            display: flex; flex-direction: column; justify-content: center;
            border-right: 1px dashed #6e5849; padding-right: 16px;
        }
        .bc-section:last-child { border-right: none; padding-right: 0; }

        /* 1, 2, 4. Perfil */
        .bc-profile { flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
        .bc-avatar {
            width: 68px; height: 68px; border-radius: 8px;
            border: 2px solid var(--gold-border); object-fit: cover; background: #1a100a;
        }
        .bc-info { display: flex; flex-direction: column; }
        .bc-name { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--text-light); line-height: 1.1; }
        .bc-role { font-size: 0.75rem; color: #4fc3f7; font-weight: 700; text-transform: uppercase; margin-top: 4px; }

        /* 5, 8. Equipamentos (Armas e Artefatos com Imagens Quadradas) */
        .bc-gear { gap: 12px; justify-content: flex-start; }
        .bc-gear-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .bc-label { font-size: 0.7rem; color: var(--gold-light); font-weight: 700; text-transform: uppercase; }
        .bc-slots { display: flex; gap: 10px; }
        
        .item-box-square {
            width: 44px; height: 44px;
            background: #1a100a; border: 1px solid var(--gold-border); border-radius: 6px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .item-box-square img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .badge-number {
            position: absolute; bottom: -6px; right: -6px;
            background: #f6eedd; color: #170f0a; font-size: 0.7rem; font-weight: 800;
            padding: 1px 5px; border-radius: 4px; border: 1px solid var(--gold-border); z-index: 2;
        }

        /* 6, 7. Atributos */
        .bc-stats { gap: 8px; justify-content: flex-start; }
        .bc-main-stats { display: flex; flex-direction: column; gap: 4px; }
        .stat-line { font-size: 0.85rem; color: var(--text-light); display: flex; align-items: center; gap: 8px; }
        .stat-line i { color: var(--gold-light); width: 16px; text-align: center; }
        .bc-sub-stats { margin-top: 4px; }
        .bc-sub-stats p { font-size: 0.8rem; color: #4fc3f7; margin-top: 2px; font-weight: 500; }

        /* 9, 10. Ações e Talentos */
        .bc-action { justify-content: space-between; align-items: flex-end; }
        .bc-talents { width: 100%; margin-bottom: 12px; }
        .talent-seq {
            font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 700;
            color: var(--text-light); margin-top: 4px; background: #1a100a;
            padding: 6px 8px; border: 1px solid var(--gold-border);
            border-radius: 6px; text-align: center;
        }
        .btn-expand-guide {
            background: var(--gold-accent); color: #1a0f08; border: 1px solid var(--gold-light);
            padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; width: 100%; display: flex;
            align-items: center; justify-content: center; gap: 8px; text-transform: uppercase;
        }
        .btn-expand-guide:hover { background: var(--gold-light); transform: translateY(-2px); }

        /* MODAL */
        .guide-modal-overlay {
            position: fixed; inset: 0; background: rgba(10, 5, 2, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; display: none; justify-content: center; align-items: center; padding: 16px;
        }
        .guide-modal-overlay.active { display: flex; }
        .guide-modal-window {
            background: var(--paper-bg); border: 3px solid var(--gold-border); border-radius: 12px;
            width: 100%; max-width: 880px; max-height: 90vh; overflow-y: auto;
            color: var(--text-dark); position: relative; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .btn-close-modal {
            position: absolute; top: 14px; right: 14px; background: #3b2315; color: var(--gold-light);
            border: 1px solid var(--gold-border); width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .btn-close-modal:hover { background: #a32222; color: #fff; }

        /* Abas do Modal */
        .build-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--paper-border); padding-bottom: 10px; flex-wrap: wrap; }
        .build-tab-btn {
            background: var(--paper-sub); border: 1px solid var(--paper-border); color: #6e5849;
            padding: 8px 16px; border-radius: 8px 8px 0 0; font-family: 'Cinzel', serif; font-weight: 700;
            cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        .build-tab-btn.active { background: #fff; border-color: var(--gold-border); border-bottom-color: #fff; color: #4a2d18; transform: translateY(2px); }

        /* Estrutura Interna Modal */
        .guide-sheet-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
        .guide-sheet-portrait { width: 80px; height: 80px; border-radius: 8px; border: 2px solid var(--gold-border); overflow: hidden; background: #1a100a; flex-shrink: 0; }
        .guide-sheet-portrait img { width: 100%; height: 100%; object-fit: cover; }
        .guide-sheet-info h2 { font-family: 'Cinzel', serif; font-size: 1.8rem; line-height: 1; }
        .guide-two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .guide-section { background: #fff; border: 1px solid var(--paper-border); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
        .section-header-title { font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 700; color: #4a2d18; border-bottom: 1px solid var(--paper-border); padding-bottom: 5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .item-list-block { display: flex; flex-direction: column; gap: 8px; }
        .item-row-entry { display: flex; align-items: flex-start; gap: 8px; background: var(--paper-sub); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--paper-border); font-size: 0.85rem; }
        .item-row-entry.bis-entry { border-color: var(--gold-border); background: #fff8e8; }
        .item-row-entry p { color: #695240; font-size: 0.78rem; margin-top: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .stat-box { background: var(--paper-sub); padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; display: flex; justify-content: space-between; border: 1px solid var(--paper-border); }
        .teams-container { display: flex; flex-direction: column; gap: 8px; }
        .team-composition-card { background: var(--paper-sub); border: 1px solid var(--paper-border); border-radius: 6px; padding: 10px; }
        .team-name { font-size: 0.85rem; font-weight: 700; color: #4a2d18; margin-bottom: 6px; }
        .team-members-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .team-member-chip { background: #fff; border: 1px solid var(--paper-border); padding: 3px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }

        @media (max-width: 950px) {
            .build-card-rect { grid-template-columns: 1fr; gap: 14px; padding: 18px; }
            .bc-section { border-right: none; border-bottom: 1px dashed #6e5849; padding-right: 0; padding-bottom: 14px; }
            .bc-section:last-child { border-bottom: none; padding-bottom: 0; }
            .bc-action { align-items: stretch; gap: 10px; }
            .bc-gear-row { justify-content: flex-start; gap: 16px; }
            .guide-two-cols { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="brand-title"><i class="fa-solid fa-mug-hot"></i> CAFETERIA DE FONTAINE</h1>
        <div class="brand-subtitle">Catálogo Tático & Builds de Personagens</div>
    </header>

    <main class="main-container">
        <section class="filter-panel">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar personagem...">
            </div>
            <div class="filter-row">
                <span class="filter-label">Elemento:</span>
                <div class="filter-tags" id="elementFilters">
                    <button class="filter-btn active" data-element="all">Todos</button>
                    <button class="filter-btn" data-element="hydro">Hydro</button>
                    <button class="filter-btn" data-element="pyro">Pyro</button>
                    <button class="filter-btn" data-element="electro">Electro</button>
                    <button class="filter-btn" data-element="anemo">Anemo</button>
                    <button class="filter-btn" data-element="cryo">Cryo</button>
                    <button class="filter-btn" data-element="geo">Geo</button>
                    <button class="filter-btn" data-element="dendro">Dendro</button>
                </div>
            </div>
            <div class="filter-row">
                <span class="filter-label">Arma:</span>
                <div class="filter-tags" id="weaponFilters">
                    <button class="filter-btn active" data-weapon="all">Todas</button>
                    <button class="filter-btn" data-weapon="espada">Espada</button>
                    <button class="filter-btn" data-weapon="espadão">Espadão</button>
                    <button class="filter-btn" data-weapon="lança">Lança</button>
                    <button class="filter-btn" data-weapon="arco">Arco</button>
                    <button class="filter-btn" data-weapon="catalisador">Catalisador</button>
                </div>
            </div>
        </section>

        <!-- Container dos Cards Retangulares -->
        <section id="guidesContainer"></section>
    </main>

    <!-- Modal do Guia Completo -->
    <div class="guide-modal-overlay" id="guideModal">
        <div class="guide-modal-window">
            <button class="btn-close-modal" id="closeModalBtn" title="Fechar"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // LISTA DE JSONs A CARREGAR (Atualize aqui quando adicionar novos arquivos na pasta builds/)
        const guiasCadastrados = ['vesna', 'lisa', 'furina']; 
        
        let guidesData = [];
        let currentSearch = '';
        let currentElement = 'all';
        let currentWeapon = 'all';

        const guidesContainer = document.getElementById('guidesContainer');
        const modalOverlay = document.getElementById('guideModal');
        const modalContent = document.getElementById('modalContent');
        
        async function loadGuides() {
            guidesContainer.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--gold-light);">A ler os ficheiros JSON...</div>';
            for (const id of guiasCadastrados) {
                try {
                    const response = await fetch(`builds/${id}.json`);
                    if (response.ok) guidesData.push(await response.json());
                } catch (error) { console.error(`Erro ao carregar ${id}:`, error); }
            }
            renderGuides();
        }

        function renderGuides() {
            const filtered = guidesData.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(currentSearch.toLowerCase());
                const matchElement = currentElement === 'all' || item.element === currentElement;
                const matchWeapon = currentWeapon === 'all' || item.weaponType === currentWeapon;
                return matchSearch && matchElement && matchWeapon;
            });

            if (filtered.length === 0) {
                guidesContainer.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">Nenhum guia encontrado.</div>`;
                return;
            }

            guidesContainer.innerHTML = filtered.map(item => {
                const mainBuild = item.builds && item.builds.length > 0 ? item.builds[0] : null;
                if (!mainBuild) return '';

                const wpns = mainBuild.weapons.slice(0, 2);
                const arts = mainBuild.artifactSets.slice(0, 1);

                return `
                <article class="build-card-rect">
                    
                    <!-- 1, 2, 4. Perfil -->
                    <div class="bc-section bc-profile">
                        <img src="icon/${item.id}.png" class="bc-avatar" onerror="this.src='https://via.placeholder.com/68/1a100a/e6c581?text=?'" alt="${item.name}">
                        <div class="bc-info">
                            <h3 class="bc-name">${item.name}</h3>
                            <span class="bc-role">${mainBuild.role}</span>
                        </div>
                    </div>

                    <!-- 5, 8. Armas e Artefatos (Imagens quadradas) -->
                    <div class="bc-section bc-gear">
                        <div class="bc-gear-row">
                            <span class="bc-label">Armas:</span>
                            <div class="bc-slots">
                                ${wpns.map((w, index) => `
                                    <div class="item-box-square" title="\${w.name}">
                                        <img src="icon/weapons/${w.name.replace(/\\s+/g, '').toLowerCase()}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="${w.name}">
                                        <span class="item-placeholder" style="display:none; font-size: 0.55rem; color: #d2c0a3; padding: 2px; text-align: center; line-height: 1;">\${w.name.substring(0, 5)}..</span>
                                        <span class="badge-number">\${index === 0 ? '1' : '5'}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bc-gear-row" style="margin-top: 8px;">
                            <span class="bc-label">Artefatos:</span>
                            <div class="bc-slots">
                                ${arts.map(a => `
                                    <div class="item-box-square" title="\${a.name}">
                                        <img src="icon/artifacts/${a.name.replace(/\\s+/g, '').toLowerCase()}.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="${a.name}">
                                        <span class="item-placeholder" style="display:none; font-size: 0.6rem; color: #d2c0a3;">Set</span>
                                        <span class="badge-number">4</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- 6, 7. Status Principais e Sub-status -->
                    <div class="bc-section bc-stats">
                        <div class="bc-main-stats">
                            <div class="stat-line" title="Ampulheta"><i class="fa-solid fa-hourglass-half"></i> <span>${mainBuild.mainStats.sands}</span></div>
                            <div class="stat-line" title="Cálice"><i class="fa-solid fa-wine-glass"></i> <span>${mainBuild.mainStats.goblet}</span></div>
                            <div class="stat-line" title="Tiara"><i class="fa-solid fa-crown"></i> <span>${mainBuild.mainStats.circlet}</span></div>
                        </div>
                        <div class="bc-sub-stats">
                            <span class="bc-label">Sub-atributos:</span>
                            <p>${mainBuild.subStatsPriority}</p>
                        </div>
                    </div>

                    <!-- 9, 10. Talentos e Botão -->
                    <div class="bc-section bc-action">
                        <div class="bc-talents">
                            <span class="bc-label">Talentos:</span>
                            <div class="talent-seq">${mainBuild.talentPriority}</div>
                        </div>
                        <button class="btn-expand-guide" onclick="openFullGuide('${item.id}', 0)">
                            <i class="fa-solid fa-expand"></i> Ver Completo
                        </button>
                    </div>

                </article>
                `;
            }).join('');
        }

        window.openFullGuide = function(charId, buildIndex) {
            const charData = guidesData.find(g => g.id === charId);
            if (!charData) return;

            const build = charData.builds[buildIndex];
            let tabsHtml = '';
            if (charData.builds.length > 1) {
                tabsHtml = `
                <div class="build-tabs">
                    ${charData.builds.map((b, idx) => `
                        <button class="build-tab-btn \${idx === buildIndex ? 'active' : ''}" 
                                onclick="openFullGuide('${charId}',${idx})">
                            \${b.buildName}
                        </button>
                    `).join('')}
                </div>`;
            }

            modalContent.innerHTML = `
                <div class="guide-sheet-header">
                    <div class="guide-sheet-portrait">
                        <img src="icon/${charData.id}.png" onerror="this.src='https://via.placeholder.com/80/1a100a/e6c581?text=?'" alt="${charData.name}">
                    </div>
                    <div class="guide-sheet-info">
                        <h2>${charData.name}</h2>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">
                            <strong>Elemento:</strong> ${charData.element.toUpperCase()} | 
                            <strong>Arma:</strong> ${charData.weaponType.toUpperCase()}
                        </div>
                    </div>
                </div>

                ${tabsHtml}

                <div class="guide-section" style="margin-bottom: 16px; border-color: var(--gold-accent); background: #fffcf5;">
                    <div style="display: flex; justify-content: space-between; font-weight: 600; color: #4a2d18;">
                        <span>Função: ${build.role}</span>
                        <span>Talentos: ${build.talentPriority}</span>
                    </div>
                </div>

                <div class="guide-two-cols">
                    <div>
                        <div class="guide-section">
                            <h3 class="section-header-title"><i class="fa-solid fa-shield"></i> Escolhas de Armas</h3>
                            <div class="item-list-block">
                                ${build.weapons.map(w => `
                                    <div class="item-row-entry \${w.bis ? 'bis-entry' : ''}">
                                        <i class="fa-solid ${w.bis ? 'fa-star' : 'fa-check'}" style="color: ${w.bis ? '#c59b4c' : '#7b6250'}; margin-top: 3px;"></i>
                                        <div>
                                            <strong>${w.name}</strong>${w.note ? `<p>${w.note}</p>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="guide-section">
                            <h3 class="section-header-title"><i class="fa-solid fa-sliders"></i> Atributos (Nível 90)</h3>
                            <div class="stats-grid">
                                ${Object.entries(build.statsAim).map(stat => `
                                    <div class="stat-box"><span>${stat[0]}</span> <strong>${stat[1]}</strong></div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="guide-section">
                            <h3 class="section-header-title"><i class="fa-solid fa-gem"></i> Artefatos Recomendados</h3>
                            <div class="item-list-block" style="margin-bottom: 10px;">
                                ${build.artifactSets.map(a => `
                                    <div class="item-row-entry">
                                        <i class="fa-solid fa-check" style="color: #c59b4c; margin-top: 3px;"></i>
                                        <div>
                                            <strong>${a.name}</strong>${a.note ? `<p>${a.note}</p>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div style="font-size: 0.8rem; background: var(--paper-sub); padding: 10px; border-radius: 6px; border: 1px solid var(--paper-border);">
                                <div style="margin-bottom: 4px;"><strong>Ampulheta:</strong> ${build.mainStats.sands}</div>
                                <div style="margin-bottom: 4px;"><strong>Cálice:</strong> ${build.mainStats.goblet}</div>
                                <div style="margin-bottom: 8px;"><strong>Tiara:</strong> ${build.mainStats.circlet}</div>
                                <div style="color: #725642;"><strong>Sub-atributos:</strong> ${build.subStatsPriority}</div>
                            </div>
                        </div>

                        <div class="guide-section">
                            <h3 class="section-header-title"><i class="fa-solid fa-users"></i> Sugestões de Equipa</h3>
                            <div class="teams-container">
                                ${build.teams.map(t => `
                                    <div class="team-composition-card">
                                        <div class="team-name">\${t.name}</div>
                                        <div class="team-members-chips">
                                            \${t.members.map(m => `<span class="team-member-chip">${m}</span>`).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                ${build.notes ? `
                <div class="guide-section" style="background: #fffdf8; border-color: var(--gold-border); margin-bottom:0;">
                    <h3 class="section-header-title"><i class="fa-solid fa-mug-hot"></i> Dicas do Barista</h3>
                    <p style="font-size: 0.85rem; color: #4a3424; line-height: 1.5;">\${build.notes}</p>
                </div>` : ''}
            `;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        document.getElementById('closeModalBtn').addEventListener('click', () => { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; });
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; } });
        document.getElementById('searchInput').addEventListener('input', (e) => { currentSearch = e.target.value; renderGuides(); });
        
        document.querySelectorAll('#elementFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#elementFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentElement = btn.dataset.element; renderGuides();
            });
        });

        document.querySelectorAll('#weaponFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#weaponFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentWeapon = btn.dataset.weapon; renderGuides();
            });
        });

        document.addEventListener('DOMContentLoaded', loadGuides);
    </script>
</body>
</html>
